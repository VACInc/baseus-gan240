[project]
name = "baseus-gan240"
version = "0.1.0"
description = "Home Assistant local BLE integration for Baseus BS-GaN240"
requires-python = ">=3.14"
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
target-version = "py314"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
