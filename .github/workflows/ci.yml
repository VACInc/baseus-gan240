name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Default to no token scopes; each job opts in to the minimum it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: false

      - name: Install test requirements
        run: |
          uv venv --python 3.14 .venv
          uv pip install --python .venv/bin/python -r requirements-test.txt

      - name: Run tests
        run: .venv/bin/python -m pytest -q --cov=custom_components.baseus_gan240 --cov-report=term-missing

      - name: Ruff lint
        run: .venv/bin/ruff check custom_components tests

      - name: Ruff format
        run: .venv/bin/ruff format --check custom_components tests
